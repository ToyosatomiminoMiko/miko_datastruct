<!DOCTYPE html>
<!--
红黑树工具的宿主页.

页面上只有一颗手写的元素 `#app`:面板(框体 + 标题栏 + 提示 / 输入框 / 输出区 / 树)
全部由 `src/main.ts` 调 `mountRBT()` 长进来,HTML 里没有第二处标记可改.
样式不在这里挂载:库层与应用层都由 `src/main.ts` 按顺序 import,Vite 会把它们抽成
产物里的一个 <link>,所以生产构建的首帧不吃 FOUC.
-->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Red-Black Tree</title>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
